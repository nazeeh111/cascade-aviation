[project]
name = "cascade-aviation"
version = "0.1.0"
description = "SQL-first, reproducible aviation disruption research and bounded scenario replay"
requires-python = ">=3.12,<3.14"
dependencies = ["duckdb>=1.4,<2", "pyarrow>=20", "requests>=2.32", "dbt-duckdb>=1.9,<2", "scikit-learn>=1.6,<2", "scipy>=1.15,<2", "numpy>=2,<3", "matplotlib>=3.10", "pyyaml>=6", "joblib>=1.4"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
cascade = "cascade.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["cascade"]
